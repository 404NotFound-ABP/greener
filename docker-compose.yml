services:
  postgres:
    build:
      context: ./db
    container_name: greener-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: [PASSWORD]
      POSTGRES_DB: greener
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greener"]
      interval: 5s
      timeout: 5s
      retries: 10

frontend:
    build:
      context: ./frontend
    container_name: greener-frontend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data: